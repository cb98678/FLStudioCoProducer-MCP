[module]
name = "create_bus_routing"
layer = "L3"
summary = "Make a music or drum bus on a free mixer insert and route parts into it (file edit of a sandbox copy), the reference's bus layout."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["project","out_project","name"],"properties":{"project":{"type":"string","x-path":true,"minLength":1},"out_project":{"type":"string","x-path":true,"minLength":1},"name":{"type":"string","minLength":1},"kind":{"type":"string","enum":["music","drums","custom"]},"parts":{"type":"array","items":{"type":["string","integer"]}},"bus":{"type":"integer","minimum":-1,"maximum":126}},"additionalProperties":false}'''
output = '''{"type": "object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "instant"
idempotent = false
verifier = "readback"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_create_bus_routing.py::test_music_bus_takes_parts_and_family_buses"
failure = "test_create_bus_routing.py::test_failures"
