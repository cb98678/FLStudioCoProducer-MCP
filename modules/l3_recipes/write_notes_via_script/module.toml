[module]
name = "write_notes_via_script"
layer = "L3"
summary = "Install the piano roll script that writes a list of notes and reports back next to itself."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["notes"],"properties":{"notes":{"type":"array","minItems":1,"maxItems":4000,"items":{"type":"object","required":["pitch","start","duration"],"properties":{"pitch":{"type":"integer"},"start":{"type":"number"},"duration":{"type":"number"},"velocity":{"type":"number"}}}},"name":{"type":"string","x-path":true,"pattern":"^[a-z_]+$"},"clear_first":{"type":"boolean"}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_write_notes_via_script.py::test_installs_a_runnable_script"
failure = "test_write_notes_via_script.py::test_invalid_notes_and_missing_folder"

[budget]
lines = 50
