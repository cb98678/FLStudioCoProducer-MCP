[module]
name = "split_vocal_phrases"
layer = "L3"
summary = "Cut a long vocal into phrase chunks in its silences, each file starting on a grid line, for Newtime and Newtone chunk by chunk."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path","out_dir","bpm"],"properties":{"path":{"type":"string","minLength":1},"out_dir":{"type":"string","minLength":1},"bpm":{"type":"number"},"origin_s":{"type":"number","minimum":0},"words_path":{"type":"string"},"lead_s":{"type":"number","maximum":0.2},"options":{"type":"object","properties":{"floor_under_db":{"type":"number","minimum":10,"maximum":60},"phrase_gap_s":{"type":"number","minimum":0.1,"maximum":2},"min_gap_s":{"type":"number","minimum":0.05,"maximum":1},"max_beats":{"type":"number","minimum":2,"maximum":64},"max_move_s":{"type":"number","minimum":0.005,"maximum":0.2},"stem":{"type":"string","minLength":1}},"additionalProperties":false}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "seconds"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_split_vocal_phrases.py::test_cuts_phrases_in_their_silences_on_grid_lines"
failure = "test_split_vocal_phrases.py::test_refuses_bad_input"

[budget]
lines = 60
params = 7
