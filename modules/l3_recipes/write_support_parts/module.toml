[module]
name = "write_support_parts"
layer = "L3"
summary = "Write a pad, keys, bass and answer line around a vocal the way a session arranger would (no heard notes copied), with their check, as JSON and MIDI in the sandbox."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["vocal_path","chords","bpm","bars","key_pc","sections","out_path"],"properties":{"vocal_path":{"type":"string","minLength":1},"chords":{"type":"array","minItems":1,"items":{"type":"object","properties":{"bar":{"type":"integer","minimum":1},"chord":{"type":["string","null"]},"margin":{"type":"number"},"cands":{"type":"array","items":{"type":"string"}}}}},"bpm":{"type":"number","minimum":40,"maximum":250},"bars":{"type":"integer","minimum":1,"maximum":512},"key_pc":{"type":"integer","minimum":0,"maximum":11},"sections":{"type":"array","items":{"type":"object","properties":{"bars":{"type":"array","items":{"type":"integer"},"minItems":2,"maxItems":2},"cell":{"type":"string"},"name":{"type":"string"},"last":{"type":"object"}}}},"out_path":{"type":"string","minLength":1},"options":{"type":"object","properties":{"origin_s":{"type":"number","minimum":0},"mode":{"type":"string","enum":["major","minor"]},"floor_under_db":{"type":"number","minimum":6,"maximum":60},"answer_every":{"type":"integer","minimum":1,"maximum":8},"soft_bars":{"type":"array","items":{"type":"integer"}},"vocal_notes":{"type":"array","items":{"type":"array"}}},"additionalProperties":false}},"additionalProperties":false}'''
output = '''{"type":"object","required":["path","midi","check"],"properties":{"path":{"type":"string"},"midi":{"type":"string"},"check":{"type":"object"},"modes":{"type":"array"},"answers":{"type":"array"},"counts":{"type":"object"}}}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "seconds"
idempotent = true
verifier = "readback"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = ["numpy", "soundfile", "mido"]

[tests]
golden = "test_write_support_parts.py::test_parts_around_a_vocal_pass_their_check"
failure = "test_write_support_parts.py::test_failures"

[budget]
lines = 60
params = 8
