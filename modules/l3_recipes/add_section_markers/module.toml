[module]
name = "add_section_markers"
layer = "L3"
summary = "Write time markers for song sections into the current arrangement of a sandbox copy, as FL 26 writes them."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["project","out_project","sections"],"properties":{"project":{"type":"string","x-path":true,"minLength":1},"out_project":{"type":"string","x-path":true,"minLength":1},"sections":{"type":"array","items":{"type":"object","required":["name","bar"],"properties":{"name":{"type":"string","minLength":1},"bar":{"type":"number","minimum":1}}}}},"additionalProperties":false}'''
output = '''{"type": "object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "instant"
idempotent = false
verifier = "readback"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_add_section_markers.py::test_writes_markers"
failure = "test_add_section_markers.py::test_failures"
