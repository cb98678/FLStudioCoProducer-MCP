[module]
name = "join_vocal_chunks"
layer = "L3"
summary = "Lay a manifest's vocal chunks (or their edited copies) back on one clock as a full-length vocal file."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["manifest_path","out_path"],"properties":{"manifest_path":{"type":"string","minLength":1},"out_path":{"type":"string","minLength":1},"suffix":{"type":"string"},"shifts_16ths":{"type":"object"}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "seconds"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_join_vocal_chunks.py::test_lays_edited_chunks_back_at_their_grid_lines"
failure = "test_join_vocal_chunks.py::test_refuses_bad_paths"
