[module]
name = "compare_part_levels"
layer = "L3"
summary = "Compare solo-render loudness of each part with a profile from an approved mix and write the fader changes into a sandbox copy."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["project","solo_dir","render_dir","profile"],"properties":{"project":{"type":"string","x-path":true,"minLength":1},"solo_dir":{"type":"string","x-path":true,"minLength":1},"render_dir":{"type":"string","x-path":true,"minLength":1},"profile":{"type":"object"},"out_project":{"type":"string","x-path":true}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "seconds"
idempotent = true
verifier = "readback"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_compare_part_levels.py::test_plans_and_applies"
failure = "test_compare_part_levels.py::test_failures"
