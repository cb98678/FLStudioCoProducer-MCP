[module]
name = "build_song_plan"
layer = "L3"
summary = "Draft a song plan (chops, roles, vocal clips, chord loop, arrangement) for a remix from a song's lyrics with word times and its drum hits."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["words_file","hits_file","out_plan","name"],"properties":{"words_file":{"type":"string","x-path":true,"minLength":1},"hits_file":{"type":"string","x-path":true,"minLength":1},"out_plan":{"type":"string","x-path":true,"minLength":1},"name":{"type":"string","minLength":1},"title":{"type":"string"},"options":{"type":"object"}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "seconds"
idempotent = true
verifier = "readback"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_build_song_plan.py::test_drafts_a_valid_plan"
failure = "test_build_song_plan.py::test_failures"
