[module]
name = "set_tempo_verified"
layer = "L2"
summary = "Set the project tempo in beats per minute and confirm by reading it back."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["bpm"],"properties":{"bpm":{"type":"number","minimum":20,"maximum":999}},"additionalProperties":false}'''
output = '''{"type":"number"}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 45
calls = ["op_mixer_set_current_tempo", "op_mixer_get_current_tempo"]
models = []
binaries = []
packages = []

[tests]
golden = "test_set_tempo_verified.py::test_sets_tempo"
failure = "test_set_tempo_verified.py::test_failures"
