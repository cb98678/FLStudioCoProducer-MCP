[module]
name = "list_playlist_tracks"
layer = "L2"
summary = "List playlist tracks with name and mute state."
version = "1.0.0"

[io]
input = '''{"type":"object","properties":{"only_named":{"type":"boolean"},"limit":{"type":"integer","minimum":1,"maximum":500}},"additionalProperties":false}'''
output = '''{"type":"array","items":{"type":"object"}}'''

[policy]
side_effect = "reads_fl"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = ["op_playlist_track_count", "op_playlist_get_track_name", "op_playlist_is_track_muted"]
models = []
binaries = []
packages = []

[tests]
golden = "test_list_playlist_tracks.py::test_lists_named_tracks"
failure = "test_list_playlist_tracks.py::test_surfaces_read_error"
