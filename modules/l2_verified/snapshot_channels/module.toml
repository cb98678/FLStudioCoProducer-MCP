[module]
name = "snapshot_channels"
layer = "L2"
summary = "Capture the main settings of every channel into a plain dictionary."
version = "1.0.0"

[io]
input = '''{"type":"object","properties":{},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "reads_fl"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = ["op_channels_channel_count", "op_channels_get_channel_name", "op_channels_get_channel_volume", "op_channels_get_channel_pan", "op_channels_is_channel_muted", "op_channels_get_target_fx_track"]
models = []
binaries = []
packages = []

[tests]
golden = "test_snapshot_channels.py::test_captures_channels"
failure = "test_snapshot_channels.py::test_surfaces_read_error"
