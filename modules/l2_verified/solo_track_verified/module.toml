[module]
name = "solo_track_verified"
layer = "L2"
summary = "Set a mixer track's solo state to an explicit value and confirm it."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["index","solo"],"properties":{"index":{"type":"integer","minimum":0},"solo":{"type":"boolean"}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_mixer_solo_track", "op_mixer_is_track_solo"]
models = []
binaries = []
packages = []

[tests]
golden = "test_solo_track_verified.py::test_reads_back_and_changes_fake"
failure = "test_solo_track_verified.py::test_failures"
