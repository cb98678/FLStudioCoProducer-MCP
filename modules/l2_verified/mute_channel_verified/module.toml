[module]
name = "mute_channel_verified"
layer = "L2"
summary = "Set a channel's mute state to an explicit value and confirm it."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["index","muted"],"properties":{"index":{"type":"integer","minimum":0},"muted":{"type":"boolean"}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_channels_mute_channel", "op_channels_is_channel_muted"]
models = []
binaries = []
packages = []

[tests]
golden = "test_mute_channel_verified.py::test_reads_back_and_changes_fake"
failure = "test_mute_channel_verified.py::test_failures"
