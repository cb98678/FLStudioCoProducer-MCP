[module]
name = "route_channel_to_track_verified"
layer = "L2"
summary = "Route a channel to a mixer track and confirm by reading the target back."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["channel_index","track_index"],"properties":{"channel_index":{"type":"integer","minimum":0},"track_index":{"type":"integer","minimum":0}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_channels_set_target_fx_track", "op_channels_get_target_fx_track"]
models = []
binaries = []
packages = []

[tests]
golden = "test_route_channel_to_track_verified.py::test_reads_back_and_changes_fake"
failure = "test_route_channel_to_track_verified.py::test_failures"
