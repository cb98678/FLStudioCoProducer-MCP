[module]
name = "list_patterns_summary"
layer = "L2"
summary = "List patterns that hold data with name and length."
version = "1.0.0"

[io]
input = '''{"type":"object","properties":{"limit":{"type":"integer","minimum":1,"maximum":999}},"additionalProperties":false}'''
output = '''{"type":"array","items":{"type":"object"}}'''

[policy]
side_effect = "reads_fl"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = ["op_patterns_pattern_count", "op_patterns_is_pattern_default", "op_patterns_get_pattern_name", "op_patterns_get_pattern_length"]
models = []
binaries = []
packages = []

[tests]
golden = "test_list_patterns_summary.py::test_lists_patterns"
failure = "test_list_patterns_summary.py::test_surfaces_read_error"
