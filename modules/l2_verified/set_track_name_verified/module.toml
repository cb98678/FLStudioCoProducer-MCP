[module]
name = "set_track_name_verified"
layer = "L2"
summary = "Rename a mixer track and confirm by reading the name back."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["index","name"],"properties":{"index":{"type":"integer","minimum":0},"name":{"type":"string","minLength":1,"maxLength":64}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_mixer_set_track_name", "op_mixer_get_track_name"]
models = []
binaries = []
packages = []

[tests]
golden = "test_set_track_name_verified.py::test_reads_back_and_changes_fake"
failure = "test_set_track_name_verified.py::test_failures"
