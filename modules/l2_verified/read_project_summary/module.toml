[module]
name = "read_project_summary"
layer = "L2"
summary = "Return counts of mixer tracks, channels, patterns with data, and playlist tracks, plus tempo and project name."
version = "1.0.0"

[io]
input = '''{"type":"object","properties":{},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "reads_fl"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = ["op_mixer_track_count", "op_channels_channel_count", "op_patterns_pattern_count", "op_playlist_track_count", "op_mixer_get_current_tempo", "op_ui_get_prog_title"]
models = []
binaries = []
packages = []

[tests]
golden = "test_read_project_summary.py::test_counts_match_fake"
failure = "test_read_project_summary.py::test_reports_read_failure"
