[module]
name = "set_route_level_verified"
layer = "L2"
summary = "Set the send level from one mixer track to another (0.0 to 1.0) and confirm it."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["index","dest_index","level"],"properties":{"index":{"type":"integer","minimum":0},"dest_index":{"type":"integer","minimum":0},"level":{"type":"number","minimum":0.0,"maximum":1.0}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_mixer_set_route_to_level", "op_mixer_get_route_to_level"]
models = []
binaries = []
packages = []

[tests]
golden = "test_set_route_level_verified.py::test_reads_back_and_changes_fake"
failure = "test_set_route_level_verified.py::test_failures"
