[module]
name = "select_pattern_verified"
layer = "L2"
summary = "Make a pattern current and confirm by reading the current pattern number."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["index"],"properties":{"index":{"type":"integer","minimum":1}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_patterns_jump_to_pattern", "op_patterns_pattern_number"]
models = []
binaries = []
packages = []

[tests]
golden = "test_select_pattern_verified.py::test_reads_back_and_changes_fake"
failure = "test_select_pattern_verified.py::test_failures"
