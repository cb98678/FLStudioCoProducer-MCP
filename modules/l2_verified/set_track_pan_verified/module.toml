[module]
name = "set_track_pan_verified"
layer = "L2"
summary = "Set a mixer track's pan from -1.0 (left) to 1.0 (right) and confirm by reading it back."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["index","pan"],"properties":{"index":{"type":"integer","minimum":0},"pan":{"type":"number","minimum":-1.0,"maximum":1.0}},"additionalProperties":false}'''
output = '''{"type":["number","string","boolean","integer"]}'''

[policy]
side_effect = "writes_fl_sandbox"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "readback"

[deps]
min_api = 1
calls = ["op_mixer_set_track_pan", "op_mixer_get_track_pan"]
models = []
binaries = []
packages = []

[tests]
golden = "test_set_track_pan_verified.py::test_reads_back_and_changes_fake"
failure = "test_set_track_pan_verified.py::test_failures"
