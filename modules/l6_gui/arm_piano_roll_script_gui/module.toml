[module]
name = "arm_piano_roll_script_gui"
layer = "L6"
summary = "Open the piano roll and pick a script from its Tools menu."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["script"],"properties":{"script":{"type":"string","minLength":1,"maxLength":300}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "seconds"
idempotent = false
verifier = "screenshot"

[deps]
min_api = 0
calls = ["run_gui_recipe"]
models = []
binaries = []
packages = []

[tests]
golden = "test_arm_piano_roll_script_gui.py::test_runs_its_recipe"
failure = "test_arm_piano_roll_script_gui.py::test_refuses_bad_input"
