[module]
name = "set_sidechain_send_gui"
layer = "L6"
summary = "Turn an existing mixer send into a sidechain send with the send switch menu."
version = "1.0.0"

[io]
input = '''{"type":"object","properties":{"source":{"type":"integer","minimum":1,"maximum":16},"dest":{"type":"integer","minimum":1,"maximum":16}},"required":["source","dest"],"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "seconds"
idempotent = false
verifier = "screenshot"

[deps]
min_api = 0
calls = ["run_gui_recipe"]
models = []
binaries = []
packages = []

[tests]
golden = "test_set_sidechain_send_gui.py::test_clicks_source_then_destination"
failure = "test_set_sidechain_send_gui.py::test_refuses_same_track"
