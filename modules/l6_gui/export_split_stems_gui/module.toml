[module]
name = "export_split_stems_gui"
layer = "L6"
summary = "Export one WAV per mixer track into a sandbox folder through the Export dialog."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path"],"properties":{"path":{"type":"string","minLength":1,"maxLength":300}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "seconds"
idempotent = false
verifier = "screenshot"

[deps]
min_api = 0
calls = ["check_sandbox_path", "run_gui_recipe"]
models = []
binaries = []
packages = []

[tests]
golden = "test_export_split_stems_gui.py::test_runs_its_recipe"
failure = "test_export_split_stems_gui.py::test_refuses_bad_input"
