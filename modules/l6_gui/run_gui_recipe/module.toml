[module]
name = "run_gui_recipe"
layer = "L6"
summary = "Run a named GUI recipe step by step with checks after each step."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["name"],"properties":{"name":{"type":"string","x-path":true,"pattern":"^[a-z_]+$"},"params":{"type":"object"}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "seconds"
idempotent = false
verifier = "screenshot"
expose = false

[deps]
min_api = 0
calls = ["load_gui_recipe", "check_sandbox_project_open", "locate_template", "press_hotkey", "type_text", "click_at", "locate_element", "list_open_dialogs", "check_desktop_ready", "take_screenshot"]
models = []
binaries = []
packages = []

[tests]
golden = "test_run_gui_recipe.py::test_runs_a_recipe_end_to_end"
failure = "test_run_gui_recipe.py::test_stops_and_explains"

[budget]
lines = 45
