[module]
name = "quantize_vocal_gui"
layer = "L6"
summary = "Fit a vocal to the beat in FL's Newtime: warp markers at its syllable onsets, quantized to the grid, saved as a new file."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path","out_path","bpm"],"properties":{"path":{"type":"string","minLength":1,"maxLength":400},"out_path":{"type":"string","minLength":1,"maxLength":400},"bpm":{"type":"number","minimum":40,"maximum":250},"division":{"type":"integer"},"lead_s":{"type":"number","maximum":0.2},"grid_up":{"type":"integer","minimum":1,"maximum":10000},"grid_down":{"type":"integer","minimum":1,"maximum":10000}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "minutes"
idempotent = false
verifier = "screenshot"

[deps]
min_api = 0
calls = ["check_sandbox_path", "prepare_rate_copy", "detect_warp_markers", "run_gui_recipe", "add_warp_markers_gui"]
models = []
binaries = []
packages = []

[tests]
golden = "test_quantize_vocal_gui.py::test_detects_opens_marks_quantizes_and_saves"
failure = "test_quantize_vocal_gui.py::test_refuses_and_stops_early"

[budget]
params = 7
