[module]
name = "load_sample_gui"
layer = "L6"
summary = "Load a sample into the channel rack by searching the sample browser."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["filename"],"properties":{"filename":{"type":"string","minLength":1,"maxLength":300}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "seconds"
idempotent = false
verifier = "screenshot"

[deps]
min_api = 0
calls = ["run_gui_recipe"]
models = []
binaries = []
packages = []

[tests]
golden = "test_load_sample_gui.py::test_runs_its_recipe"
failure = "test_load_sample_gui.py::test_refuses_bad_input"
