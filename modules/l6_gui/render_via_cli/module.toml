[module]
name = "render_via_cli"
layer = "L6"
summary = "Render a saved sandbox project to WAV through FL Studio's command line."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["project","out_dir"],"properties":{"project":{"type":"string","minLength":1},"out_dir":{"type":"string","minLength":1},"timeout_s":{"type":"integer","minimum":1,"maximum":3600},"stall_s":{"type":"integer","minimum":1,"maximum":7200}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "system"
autonomy = "A2"
cost = "minutes"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path", "detect_silence", "check_project_health"]
models = []
binaries = []
packages = []

[tests]
golden = "test_render_via_cli.py::test_renders_with_fake_exe"
failure = "test_render_via_cli.py::test_errors"

[budget]
lines = 45
