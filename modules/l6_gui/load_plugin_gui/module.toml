[module]
name = "load_plugin_gui"
layer = "L6"
summary = "Add a plugin to the channel rack by name through the plugin picker."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["name"],"properties":{"name":{"type":"string","minLength":1,"maxLength":300}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "gui"
autonomy = "A2"
cost = "seconds"
idempotent = false
verifier = "screenshot"

[deps]
min_api = 0
calls = ["run_gui_recipe"]
models = []
binaries = []
packages = []

[tests]
golden = "test_load_plugin_gui.py::test_runs_its_recipe"
failure = "test_load_plugin_gui.py::test_refuses_bad_input"
