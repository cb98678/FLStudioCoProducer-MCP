[module]
name = "read_audio_file"
layer = "L4"
summary = "Load an audio file as a float array with its sample rate. max_seconds 0 reads the whole file."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path"],"properties":{"path":{"type":"string","minLength":1},"max_seconds":{"type":"number","minimum":0,"maximum":86400}},"additionalProperties":false}'''
output = '''{"type": "object"}'''

[policy]
side_effect = "reads_files"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"
expose = false

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_read_audio_file.py::test_known_signal"
failure = "test_read_audio_file.py::test_failures"
