[module]
name = "measure_true_peak"
layer = "L4"
summary = "Measure the true peak of an audio file in dBTP using oversampling, and flag intersample overs."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path"],"properties":{"path":{"type":"string","minLength":1},"oversample":{"type":"integer","enum":[2,4,8]}},"additionalProperties":false}'''
output = '''{"type": "object"}'''

[policy]
side_effect = "reads_files"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_measure_true_peak.py::test_known_signal"
failure = "test_measure_true_peak.py::test_failures"
