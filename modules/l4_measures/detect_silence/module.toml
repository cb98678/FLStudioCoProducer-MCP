[module]
name = "detect_silence"
layer = "L4"
summary = "Find silent regions in an audio file and report whether it is mostly silent."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path"],"properties":{"path":{"type":"string","minLength":1},"threshold_db":{"type":"number","minimum":-120,"maximum":0},"min_len_s":{"type":"number","minimum":0.01,"maximum":60}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "reads_files"
autonomy = "A0"
cost = "seconds"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_detect_silence.py::test_finds_regions"
failure = "test_detect_silence.py::test_failures"

[budget]
lines = 45
