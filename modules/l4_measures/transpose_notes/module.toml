[module]
name = "transpose_notes"
layer = "L4"
summary = "Shift a note list by a number of semitones."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["notes","semitones"],"properties":{"notes":{"type":"array","items":{"type":"object","required":["pitch","start","duration"],"properties":{"pitch":{"type":"integer","minimum":0,"maximum":127},"start":{"type":"number","minimum":0},"duration":{"type":"number","exclusiveMinimum":0},"velocity":{"type":"integer","minimum":1,"maximum":127}}}},"semitones":{"type":"integer","minimum":-96,"maximum":96},"fold_octaves":{"type":"boolean"}},"additionalProperties":false}'''
output = '''{"type":"array","items":{"type":"object"}}'''

[policy]
side_effect = "pure"
autonomy = "A0"
cost = "instant"
idempotent = false
verifier = "none"

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_transpose_notes.py::test_shifts_pitches"
failure = "test_transpose_notes.py::test_out_of_range"
