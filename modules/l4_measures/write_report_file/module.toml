[module]
name = "write_report_file"
layer = "L4"
summary = "Write a JSON or markdown report inside the sandbox folder."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path","content"],"properties":{"path":{"type":"string","minLength":1},"content":{"type":["object","string"]},"fmt":{"type":"string","enum":["json","markdown"]}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "instant"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_write_report_file.py::test_writes_json_and_markdown"
failure = "test_write_report_file.py::test_sandbox_and_format_errors"

[budget]
lines = 45
