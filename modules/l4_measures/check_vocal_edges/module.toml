[module]
name = "check_vocal_edges"
layer = "L4"
summary = "Judge the end of a finished vocal chop (cut mid-sound or clean), report its start level, and say whether it ends on a hiss such as the s of blues."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path"],"properties":{"path":{"type":"string","minLength":1},"fade_ms":{"type":"number","minimum":0,"maximum":200}},"additionalProperties":false}'''
output = '''{"type": "object"}'''

[policy]
side_effect = "reads_files"
autonomy = "A0"
cost = "instant"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_check_vocal_edges.py::test_clean_and_cut_chops"
failure = "test_check_vocal_edges.py::test_failures"
