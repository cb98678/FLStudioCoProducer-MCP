[module]
name = "extract_melody_contour"
layer = "L4"
summary = "Reduce a note list to one melodic line and describe its shape."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["notes"],"properties":{"notes":{"type":"array","items":{"type":"object","required":["pitch","start","duration"],"properties":{"pitch":{"type":"integer","minimum":0,"maximum":127},"start":{"type":"number","minimum":0},"duration":{"type":"number","exclusiveMinimum":0},"velocity":{"type":"integer","minimum":1,"maximum":127}}}},"voice":{"type":"string","enum":["top","bottom"]}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "pure"
autonomy = "A0"
cost = "instant"
idempotent = true
verifier = "none"

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_extract_melody_contour.py::test_extracts_the_top_line"
failure = "test_extract_melody_contour.py::test_empty_list"
