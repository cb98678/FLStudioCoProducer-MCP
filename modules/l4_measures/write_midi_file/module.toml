[module]
name = "write_midi_file"
layer = "L4"
summary = "Write a note list to a MIDI file inside the sandbox folder."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["notes","path"],"properties":{"notes":{"type":"array","items":{"type":"object","required":["pitch","start","duration"],"properties":{"pitch":{"type":"integer","minimum":0,"maximum":127},"start":{"type":"number","minimum":0},"duration":{"type":"number","exclusiveMinimum":0},"velocity":{"type":"integer","minimum":1,"maximum":127}}}},"path":{"type":"string","minLength":1},"tempo_bpm":{"type":"number","minimum":20,"maximum":999},"ppq":{"type":"integer","minimum":24,"maximum":3840}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "writes_files"
autonomy = "A2"
cost = "seconds"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path"]
models = []
binaries = []
packages = []

[tests]
golden = "test_write_midi_file.py::test_writes_and_rereads"
failure = "test_write_midi_file.py::test_sandbox_and_input_errors"

[budget]
lines = 45
