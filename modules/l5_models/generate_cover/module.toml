[module]
name = "generate_cover"
layer = "L5"
summary = "Generate a cover of a reference audio file in a new style."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["src_path","prompt","out_dir"],"properties":{"src_path":{"type":"string","minLength":1},"prompt":{"type":"string","minLength":3,"maxLength":512},"out_dir":{"type":"string","minLength":1},"strength":{"type":"number","minimum":0,"maximum":1},"seed":{"type":"integer"}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "system"
autonomy = "A2"
cost = "gpu"
idempotent = false
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path", "run_model_op", "detect_silence"]
models = ["acestep"]
binaries = []
packages = []

[tests]
golden = "test_generate_cover.py::test_makes_a_cover"
failure = "test_generate_cover.py::test_missing_source"

[budget]
lines = 45
