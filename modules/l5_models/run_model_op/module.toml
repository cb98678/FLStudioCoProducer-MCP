[module]
name = "run_model_op"
layer = "L5"
summary = "Run one operation on a local model through the GPU scheduler."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["model","op","args"],"properties":{"model":{"type":"string","minLength":1},"op":{"type":"string","minLength":1},"args":{"type":"object"},"timeout_s":{"type":"number","exclusiveMinimum":0,"maximum":7200}},"additionalProperties":false}'''
output = '''{}'''

[policy]
side_effect = "system"
autonomy = "A2"
cost = "gpu"
idempotent = false
verifier = "none"
expose = false

[deps]
min_api = 0
calls = []
models = []
binaries = []
packages = []

[tests]
golden = "test_run_model_op.py::test_runs_an_op"
failure = "test_run_model_op.py::test_errors_pass_through"
