[module]
name = "separate_stems_hq"
layer = "L5"
summary = "Split a song into vocals (Mel-Band RoFormer) and drums, bass and other (Demucs on the instrumental)."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["input_path","out_dir"],"properties":{"input_path":{"type":"string","minLength":1},"out_dir":{"type":"string","minLength":1},"quality":{"type":"string","enum":["fast","high"]}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "system"
autonomy = "A2"
cost = "gpu"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["check_sandbox_path", "run_model_op", "separate_stems"]
models = ["roformer", "demucs"]
binaries = []
packages = []

[tests]
golden = "test_separate_stems_hq.py::test_four_stems_with_roformer_vocals"
failure = "test_separate_stems_hq.py::test_errors"

[budget]
lines = 45
