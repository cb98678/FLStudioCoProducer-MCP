[module]
name = "compare_to_references_ml"
layer = "L5"
summary = "How close windows of a remix sound to the person's reference tracks, by MuQ-MuLan embeddings (cosine similarity)."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path","references"],"properties":{"path":{"type":"string","minLength":1},"references":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},"windows":{"type":"array","items":{"type":"array","minItems":2,"maxItems":2,"items":{"type":"number","minimum":0}}},"baseline":{"type":"string"}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "system"
autonomy = "A2"
cost = "gpu"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["run_model_op"]
models = ["mir"]
binaries = []
packages = []

[tests]
golden = "test_compare_to_references_ml.py::test_similarity_against_references_and_a_baseline"
failure = "test_compare_to_references_ml.py::test_errors"

[budget]
lines = 45
