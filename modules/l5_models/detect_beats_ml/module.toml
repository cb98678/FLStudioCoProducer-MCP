[module]
name = "detect_beats_ml"
layer = "L5"
summary = "Beats, downbeats, tempo, meter and drift of an audio file with the beat_this model."
version = "1.0.0"

[io]
input = '''{"type":"object","required":["path"],"properties":{"path":{"type":"string","minLength":1},"drift_pct":{"type":"number","minimum":0.5,"maximum":20}},"additionalProperties":false}'''
output = '''{"type":"object"}'''

[policy]
side_effect = "system"
autonomy = "A2"
cost = "gpu"
idempotent = true
verifier = "measure"

[deps]
min_api = 0
calls = ["run_model_op"]
models = ["mir"]
binaries = []
packages = []

[tests]
golden = "test_detect_beats_ml.py::test_grid_from_the_model"
failure = "test_detect_beats_ml.py::test_errors"

[budget]
lines = 45
