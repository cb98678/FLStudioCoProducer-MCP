[project]
name = "coproducer"
version = "0.1.0"
description = "Local-first AI co-producer for FL Studio: clean-room MCP servers, modules, orchestrator"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "soundfile==0.14.0",
  "pyloudnorm==0.2.0",
  "mido==1.3.3",
  "jsonschema==4.26.0",
  "mcp==2.3.0",
  "cbor2==6.1.3",       # Serum 2 preset and state containers (serumstate.py); the same pins as serum-mcp's uv.lock
  "zstandard==0.25.0",
]

[project.optional-dependencies]
midi = ["python-rtmidi==1.5.8"]
gui = ["mss==10.2.0", "pillow==13.0.0", "pyautogui==0.9.54"]
vocal = ["noisereduce==3.0.3"]  # vocalfx.denoise; pulls matplotlib, joblib and tqdm, pinned in requirements.lock
dev = ["pytest==9.1.1", "hypothesis==6.170.1", "fl-studio-api-stubs==37.0.1"]

[project.scripts]
coproducer = "coproducer.cli:main"
coproducer-fl-bridge = "coproducer.servers.fl_bridge:run"
coproducer-studio-audio = "coproducer.servers.studio_audio:run"
coproducer-studio-ml = "coproducer.servers.studio_ml:run"
coproducer-desktop-control = "coproducer.servers.desktop_control:run"

[build-system]
requires = ["setuptools==80.10.2"]  # exact, like every other pin; the build runs isolated, so this is what pip -e . fetches
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coproducer = ["data/*.json", "data/gui_recipes/*.json", "data/gui_templates/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider"
markers = [
  "real_fl: needs FL Studio running with the dispatcher installed",
  "gpu: needs a GPU model stack installed",
]

[tool.ruff.lint]
# The checks the code review runs (2026-10-25): real errors, bugbear, pylint errors. Line length and style are not enforced.
select = ["F", "E9", "B", "PLE"]
ignore = ["B007", "B008", "B009", "B010", "B905"]

[tool.ruff.lint.per-file-ignores]
# L1 op bodies and the FL-side template are pasted into the generated device script, where _run, _check_args, device, ui and the
# frame helpers are defined (fl_side/device_coproducer.py); they are not standalone modules.
"modules/l1_fl_ops/**" = ["F821", "F401"]
"src/coproducer/fl_template.py" = ["F821"]
